# Field Ledger — Netlify (official TanStack Start plugin)
# https://docs.netlify.com/build/frameworks/framework-setup-guides/tanstack-start/

[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY = "true"
  BETTER_AUTH_URL = "https://field-agent-maichles.netlify.app"
  BETTER_AUTH_TRUSTED_ORIGINS = "https://field-agent-maichles.netlify.app,https://*.netlify.app"
  VITE_AUTH_ENABLED = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200
  force = true

[[redirects]]
  from = "/api/push"
  to = "/.netlify/functions/push"
  status = 200
  force = true
